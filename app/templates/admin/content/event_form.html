{% extends 'admin/base.html' %}
{% block admin_title %}Add Calendar Event{% endblock %}
{% block page_title %}Add New Calendar Event / Aradhana{% endblock %}

{% block content %}
<div style="max-width: 800px;">
  <div class="admin-card" style="padding: 32px;">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group" style="margin-bottom: 20px;">
        <label class="form-label" for="title">Event Title *</label>
        <input type="text" id="title" name="title" class="form-control" required placeholder="e.g. Sri Madhvacharya Jayanti">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
        <div class="form-group">
          <label class="form-label" for="event_date">Event Date *</label>
          <input type="date" id="event_date" name="event_date" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="event_type">Event Type</label>
          <select id="event_type" name="event_type" class="form-control">
            <option value="aradhana">Guru Aradhana</option>
            <option value="festival">Festival / Jayanti</option>
            <option value="event">Special Event / Pravachana</option>
          </select>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
        <div class="form-group">
          <label class="form-label" for="tithi">Tithi / Lunar Date</label>
          <input type="text" id="tithi" name="tithi" class="form-control" placeholder="e.g. Magha Shukla Navami">
        </div>
        <div class="form-group">
          <label class="form-label" for="guru_id">Associated Guru</label>
          <select id="guru_id" name="guru_id" class="form-control">
            <option value="">None / General Event</option>
            {% for g in gurus %}
              <option value="{{ g.id }}">{{ g.name }} (#{{ g.guru_order }})</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label" for="description">Description / Significance</label>
        <textarea id="description" name="description" class="form-control" rows="4"></textarea>
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
          <input type="checkbox" name="is_active" value="1" checked>
          <span>Active (Visible on public calendar)</span>
        </label>
      </div>

      <div style="display: flex; gap: 12px;">
        <button type="submit" class="btn btn-primary" style="padding: 10px 24px;">
          Add Event
        </button>
        <a href="{{ url_for('admin.events_list') }}" class="btn btn-outline" style="padding: 10px 24px;">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
