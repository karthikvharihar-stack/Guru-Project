{% extends 'admin/base.html' %}
{% block admin_title %}{{ 'Edit Media' if media else 'Add Media' }}{% endblock %}
{% block page_title %}{{ 'Edit Media: ' + media.title if media else 'Add New Media Item' }}{% endblock %}

{% block content %}
<div style="max-width: 800px;">
  <div class="admin-card" style="padding: 32px;">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group" style="margin-bottom: 20px;">
        <label class="form-label" for="title">Title *</label>
        <input type="text" id="title" name="title" class="form-control" required value="{{ media.title if media else '' }}">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
        <div class="form-group">
          <label class="form-label" for="speaker">Speaker / Scholar</label>
          <input type="text" id="speaker" name="speaker" class="form-control" placeholder="e.g. Sri Vidyavachaspati" value="{{ media.speaker if media else '' }}">
        </div>
        <div class="form-group">
          <label class="form-label" for="topic">Topic</label>
          <input type="text" id="topic" name="topic" class="form-control" placeholder="e.g. Nyaya Sudha Mangalacharana" value="{{ media.topic if media else '' }}">
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px;">
        <div class="form-group">
          <label class="form-label" for="media_type">Media Type</label>
          <select id="media_type" name="media_type" class="form-control">
            <option value="video" {% if media and media.media_type == 'video' %}selected{% endif %}>Video</option>
            <option value="audio" {% if media and media.media_type == 'audio' %}selected{% endif %}>Audio</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="language">Language</label>
          <select id="language" name="language" class="form-control">
            <option value="Kannada" {% if media and media.language == 'Kannada' %}selected{% endif %}>Kannada</option>
            <option value="Sanskrit" {% if media and media.language == 'Sanskrit' %}selected{% endif %}>Sanskrit</option>
            <option value="English" {% if media and media.language == 'English' %}selected{% endif %}>English</option>
            <option value="Hindi" {% if media and media.language == 'Hindi' %}selected{% endif %}>Hindi</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="duration">Duration</label>
          <input type="text" id="duration" name="duration" class="form-control" placeholder="e.g. 45 mins" value="{{ media.duration if media else '' }}">
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 20px;">
        <label class="form-label" for="embed_url">Embed / Media URL (YouTube, Vimeo, MP3 stream)</label>
        <input type="url" id="embed_url" name="embed_url" class="form-control" placeholder="https://www.youtube.com/embed/..." value="{{ media.embed_url if media else '' }}">
      </div>

      <div class="form-group" style="margin-bottom: 20px;">
        <label class="form-label" for="thumbnail_url">Thumbnail URL</label>
        <input type="url" id="thumbnail_url" name="thumbnail_url" class="form-control" placeholder="https://..." value="{{ media.thumbnail_url if media else '' }}">
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
          <input type="checkbox" name="is_active" value="1" {% if not media or media.is_active %}checked{% endif %}>
          <span>Active (Visible on public site)</span>
        </label>
      </div>

      <div style="display: flex; gap: 12px;">
        <button type="submit" class="btn btn-primary" style="padding: 10px 24px;">
          {{ 'Save Changes' if media else 'Add Media' }}
        </button>
        <a href="{{ url_for('admin.media_list') }}" class="btn btn-outline" style="padding: 10px 24px;">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
