{% extends 'admin/base.html' %}
{% block admin_title %}{{ 'Edit Book' if book else 'Add Book' }}{% endblock %}
{% block page_title %}{{ 'Edit Book: ' + book.title if book else 'Add New Book' }}{% endblock %}

{% block content %}
<div style="max-width: 800px;">
  <div class="admin-card" style="padding: 32px;">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group" style="margin-bottom: 20px;">
        <label class="form-label" for="title">Title *</label>
        <input type="text" id="title" name="title" class="form-control" required value="{{ book.title if book else '' }}">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
        <div class="form-group">
          <label class="form-label" for="author">Author</label>
          <input type="text" id="author" name="author" class="form-control" value="{{ book.author if book else '' }}">
        </div>
        <div class="form-group">
          <label class="form-label" for="category">Category</label>
          <input type="text" id="category" name="category" class="form-control" placeholder="e.g. Dvaita Vedanta, Stotras" value="{{ book.category if book else '' }}">
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
        <div class="form-group">
          <label class="form-label" for="language">Language</label>
          <select id="language" name="language" class="form-control">
            <option value="Sanskrit" {% if book and book.language == 'Sanskrit' %}selected{% endif %}>Sanskrit</option>
            <option value="Kannada" {% if book and book.language == 'Kannada' %}selected{% endif %}>Kannada</option>
            <option value="English" {% if book and book.language == 'English' %}selected{% endif %}>English</option>
            <option value="Hindi" {% if book and book.language == 'Hindi' %}selected{% endif %}>Hindi</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="file_url">File URL (PDF / Download link)</label>
          <input type="url" id="file_url" name="file_url" class="form-control" placeholder="https://..." value="{{ book.file_url if book else '' }}">
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label" for="description">Description</label>
        <textarea id="description" name="description" class="form-control" rows="4">{{ book.description if book else '' }}</textarea>
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
          <input type="checkbox" name="is_active" value="1" {% if not book or book.is_active %}checked{% endif %}>
          <span>Active (Visible on public site)</span>
        </label>
      </div>

      <div style="display: flex; gap: 12px;">
        <button type="submit" class="btn btn-primary" style="padding: 10px 24px;">
          {{ 'Save Changes' if book else 'Create Book' }}
        </button>
        <a href="{{ url_for('admin.books_list') }}" class="btn btn-outline" style="padding: 10px 24px;">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
