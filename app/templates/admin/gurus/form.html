{% extends 'admin/base.html' %}
{% block admin_title %}{{ 'Edit' if guru else 'Add' }} Guru{% endblock %}
{% block content %}

<div class="admin-card">
  <form method="POST" enctype="multipart/form-data">
    {{ form.csrf_token if form else '' }}
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
      <div class="form-group">
        <label class="form-label">Name (English)</label>
        <input type="text" name="name" class="form-control" value="{{ guru.name if guru else '' }}" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Traditional Name (Devanagari)</label>
        <input type="text" name="traditional_name" class="form-control" value="{{ guru.traditional_name if guru else '' }}">
      </div>
      
      <div class="form-group">
        <label class="form-label">Order in Parampara</label>
        <input type="number" name="order" class="form-control" value="{{ guru.order if guru else 0 }}">
      </div>
      
      <div class="form-group">
        <label class="form-label">Image Upload</label>
        <input type="file" name="image" class="form-control">
      </div>
    </div>
    
    <div class="form-group">
      <label class="form-label">Biography</label>
      <textarea name="biography" class="form-control" rows="8">{{ guru.biography if guru else '' }}</textarea>
    </div>
    
    <hr style="border: none; border-top: 1px solid var(--color-border); margin: 30px 0;">
    <h3 style="margin-bottom: 20px;">Lekhana Seva Configuration</h3>
    
    <div class="form-group">
      <label class="form-label">Lekhana Text (Devanagari/Sanskrit)</label>
      <input type="text" name="lekhana_text" class="form-control" value="{{ guru.lekhana_text if guru else '' }}">
    </div>
    
    <div class="form-group">
      <label class="form-label">
        <input type="checkbox" name="is_verified" {% if guru and guru.is_verified %}checked{% endif %}>
        Verified and Publicly Visible
      </label>
    </div>
    
    <button type="submit" class="btn btn-primary btn-lg">Save Guru</button>
  </form>
</div>

{% endblock %}
