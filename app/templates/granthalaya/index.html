{% extends 'base.html' %}
{% block content %}
<div class="container" style="padding: 40px 15px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
    <h1 class="font-serif">Granthalaya</h1>
    <div style="display: flex; gap: 10px;">
      <input type="text" class="form-control" placeholder="Search books..." style="width: 250px;">
      <button class="btn btn-outline">Search</button>
    </div>
  </div>

  <div style="display: flex; gap: 15px; margin-bottom: 30px; overflow-x: auto; padding-bottom: 10px;">
    <button class="btn btn-primary">All</button>
    <button class="btn btn-outline">Guru Parampara</button>
    <button class="btn btn-outline">Stotras</button>
    <button class="btn btn-outline">Sanskrit</button>
    <button class="btn btn-outline">Kannada</button>
    <button class="btn btn-outline">English</button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 30px;">
    {% for book in books %}
      <div class="book-card text-center">
        <div style="height: 250px; background: var(--color-border); margin-bottom: 15px; display: flex; align-items: center; justify-content: center; border-radius: 4px;">
          <span style="color: var(--color-secondary);">[Book Cover]</span>
        </div>
        <h3 class="font-serif" style="font-size: 1.1rem; margin-bottom: 5px;">{{ book.title }}</h3>
        <p style="font-size: 0.8rem; color: var(--color-text-muted); margin-bottom: 10px;">{{ book.author }}</p>
        <span style="font-size: 0.7rem; background: var(--color-gold); color: white; padding: 3px 8px; border-radius: 10px; margin-bottom: 10px; display: inline-block;">{{ book.language }}</span>
        <a href="#" class="btn btn-outline" style="width: 100%; padding: 5px; font-size: 0.9rem;">View/Download</a>
      </div>
    {% else %}
      <div style="grid-column: 1 / -1; text-align: center; padding: 40px;" class="guru-card">
        <p>Granthalaya is currently being updated. Books will be available soon.</p>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
