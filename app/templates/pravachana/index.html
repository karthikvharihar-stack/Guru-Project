{% extends 'base.html' %}
{% block content %}
<div class="container" style="padding: 40px 15px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
    <h1 class="font-serif">Pravachana</h1>
    <div style="display: flex; gap: 10px;">
      <select class="form-control" style="width: auto;">
        <option>All Speakers</option>
      </select>
      <select class="form-control" style="width: auto;">
        <option>All Languages</option>
      </select>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px;">
    {% for media in media_items %}
      <div class="media-card">
        <div style="height: 180px; background: var(--color-dark-bg); position: relative; margin-bottom: 15px; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
          <div style="width: 50px; height: 50px; background: rgba(255,255,255,0.8); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer;">
            ▶
          </div>
        </div>
        <h3 class="font-serif" style="font-size: 1.2rem; margin-bottom: 5px;">{{ media.title }}</h3>
        <p style="font-size: 0.9rem; color: var(--color-secondary); margin-bottom: 5px;">Speaker: {{ media.speaker }}</p>
        <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--color-text-muted);">
          <span>{{ media.duration }}</span>
          <span>{{ media.language }}</span>
        </div>
      </div>
    {% else %}
      <div style="grid-column: 1 / -1; text-align: center; padding: 40px;" class="guru-card">
        <p>Pravachana library is being updated.</p>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
