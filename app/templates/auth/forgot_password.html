{% extends 'base.html' %}
{% block content %}
<div class="container" style="display: flex; align-items: center; justify-content: center; min-height: 70vh; padding: 40px 15px;">
  
  <div class="guru-card" style="width: 100%; max-width: 450px;">
    <div class="text-center" style="margin-bottom: 20px;">
      <h2 class="font-serif">Forgot Password</h2>
      <p style="font-size: 0.9rem;">Enter your email to receive a password reset link.</p>
    </div>
    
    <form method="POST" action="/auth/forgot-password">
      {{ form.csrf_token if form else '' }}
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 15px;">Send Reset Link</button>
      
      <div class="text-center" style="font-size: 0.9rem;">
        <a href="/auth/login">Back to Login</a>
      </div>
    </form>
  </div>
  
</div>
{% endblock %}
