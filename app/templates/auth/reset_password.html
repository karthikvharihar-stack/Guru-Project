{% extends 'base.html' %}
{% block title %}Reset Password | Uttaradi Math{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 60px 20px; margin-top: 70px;">
  <div style="max-width: 440px; width: 100%; background: var(--color-card); border: 1px solid var(--color-border); border-radius: 20px; padding: 40px 32px; box-shadow: 0 8px 32px rgba(44,24,16,0.08);">
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="font-size: 2.5rem; margin-bottom: 12px;">🔑</div>
      <h1 class="font-serif" style="color: var(--color-primary); font-size: 1.8rem; margin-bottom: 8px;">Reset Password</h1>
      <p style="color: var(--color-text-muted); font-size: 0.95rem;">Enter your new password below.</p>
    </div>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group" style="margin-bottom: 20px;">
        <label class="form-label" for="password">New Password</label>
        <input type="password" id="password" name="password" class="form-control" required minlength="6" placeholder="At least 6 characters">
      </div>
      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label" for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" required minlength="6" placeholder="Re-enter new password">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem;">
        Update Password
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.9rem;">
      <a href="{{ url_for('auth.login') }}" style="color: var(--color-primary); text-decoration: none;">
        ← Back to Login
      </a>
    </div>
  </div>
</div>
{% endblock %}
