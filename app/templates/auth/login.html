{% extends 'base.html' %}
{% block title %}Devotee Login — Uttaradi Math Guru Lekhana Seva{% endblock %}

{% block content %}
<div class="container" style="display: flex; align-items: center; justify-content: center; min-height: 80vh; padding: 40px 15px;">
  
  <div style="width: 100%; max-width: 440px; background: linear-gradient(135deg, #FFFDF9 0%, #FAF3E3 100%); border: 2px solid #BF953F; border-radius: 24px; padding: 36px 32px; box-shadow: 0 15px 40px rgba(0,0,0,0.15), 0 0 25px rgba(191,149,63,0.15); text-align: center;">
    
    <div style="font-size: 2.5rem; margin-bottom: 8px;">🪔</div>
    
    <h2 class="font-serif" style="color: #4A1A1A; font-size: 1.8rem; font-weight: 700; margin-bottom: 6px;">
      Devotee Login
    </h2>
    <p style="color: var(--color-text-muted); font-size: 0.9rem; margin-bottom: 24px;">
      Access your Lekhana Seva progress, acknowledgements & spiritual records
    </p>
    
    <form method="POST" action="{{ url_for('auth.login') }}" style="text-align: left;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      
      <div class="form-group" style="margin-bottom: 18px;">
        <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #4A1A1A; margin-bottom: 6px;">
          Email Address
        </label>
        <input type="email" name="email" class="form-control" placeholder="devotee@example.com" required autocomplete="email" style="width: 100%; padding: 12px 14px; border: 1.5px solid rgba(191,149,63,0.4); border-radius: 10px; background: #FFF; font-size: 0.95rem;">
      </div>
      
      <div class="form-group" style="margin-bottom: 18px;">
        <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #4A1A1A; margin-bottom: 6px;">
          Password
        </label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" style="width: 100%; padding: 12px 14px; border: 1.5px solid rgba(191,149,63,0.4); border-radius: 10px; background: #FFF; font-size: 0.95rem;">
      </div>
      
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.88rem; margin-bottom: 22px;">
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; color: #4A1A1A;">
          <input type="checkbox" name="remember" style="accent-color: #8B1A1A;"> Remember me
        </label>
        <a href="{{ url_for('auth.forgot_password') }}" style="color: #8B1A1A; text-decoration: none; font-weight: 600;">Forgot Password?</a>
      </div>
      
      <button type="submit" class="btn btn-gold" style="width: 100%; padding: 13px; font-size: 1.05rem; font-weight: 700; border-radius: 25px; margin-bottom: 18px; box-shadow: 0 4px 15px rgba(191,149,63,0.35); cursor: pointer;">
        Login to Seva
      </button>
      
      <div style="text-align: center; font-size: 0.9rem; color: var(--color-text-muted);">
        Don't have an account yet? 
        <a href="{{ url_for('auth.register') }}" style="font-weight: 700; color: #8B1A1A; text-decoration: none; margin-left: 4px;">Register here</a>
      </div>
    </form>
    
  </div>
  
</div>
{% endblock %}
