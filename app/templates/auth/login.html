{% extends 'base.html' %}
{% block content %}
<div class="container" style="display: flex; align-items: center; justify-content: center; min-height: 70vh; padding: 40px 15px;">
  
  <div class="guru-card" style="width: 100%; max-width: 450px;">
    <div class="text-center" style="margin-bottom: 20px;">
      <span style="font-size: 3rem;">🪨</span>
      <h2 class="font-serif">Devotee Login</h2>
    </div>
    
    <form method="POST" action="/auth/login">
      {{ form.csrf_token if form else '' }}
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      
      <div class="form-group" style="display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;">
        <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
          <input type="checkbox" name="remember"> Remember me
        </label>
        <a href="/auth/forgot-password" style="color: var(--color-primary);">Forgot Password?</a>
      </div>
      
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 15px;">Login</button>
      
      <div class="text-center" style="font-size: 0.9rem;">
        Don't have an account? <a href="/auth/register" style="font-weight: bold;">Register here</a>
      </div>
    </form>
  </div>
  
</div>
{% endblock %}
